packages:
  - 'apps/*'
  - 'packages/*'
  # The test suite is a workspace project so `pnpm -r typecheck` and `pnpm run lint`
  # reach it, and so pnpm links the bare specifiers its files import.
  - 'test'
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260915.1'
